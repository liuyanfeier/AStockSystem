name: Phase 0 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run --offline --frozen pytest
      - name: Run offline diagnostics
        run: uv run --offline --frozen astock doctor
