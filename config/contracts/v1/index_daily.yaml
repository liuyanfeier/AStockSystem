contract_version: '1.0'
dataset: index_daily
provider: tushare
endpoint: https://api.tushare.pro
required_fields:
- ts_code
- trade_date
- open
- high
- low
- close
- pre_close
- change
- pct_chg
- vol
- amount
natural_key:
- ts_code
- trade_date
max_rows: null
timezone: Asia/Shanghai
units:
  open: index points
  high: index points
  low: index points
  close: index points
  pre_close: index points
  change: index points
  pct_chg: percent
  vol: provider lots (手)
  amount: thousand yuan
availability_policy: UNKNOWN_UNTIL_EVIDENCE
revision_policy: APPEND_CAPTURE_NEVER_OVERWRITE
fetch_partition:
- ts_code
- start_date
- end_date
quality_checks:
- required_columns
- natural_key_duplicates
- provider_row_cap
- event_date_bounds
source_url: https://tushare.pro/document/2?doc_id=95
documentation_checked_on: '2026-10-01'
update_schedule: null
notes:
- ts_code is required by the provider.
- This endpoint excludes Shenwan industry-index bars; separate future endpoint audit
  required.
- No explicit single-request row cap found in cited documentation; null is unknown,
  not unlimited.
- Schedule is documentation metadata, not a guaranteed availability timestamp; partitions
  and quality checks are proposed, not executed.
