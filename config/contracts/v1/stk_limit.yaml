contract_version: '1.0'
dataset: stk_limit
provider: tushare
endpoint: https://api.tushare.pro
required_fields:
- trade_date
- ts_code
- pre_close
- up_limit
- down_limit
- asset_type
- exchange
natural_key:
- ts_code
- trade_date
max_rows: 5800
timezone: Asia/Shanghai
units:
  up_limit: price in security currency
  down_limit: price in security currency
  pre_close: price in security currency
availability_policy: UNKNOWN_UNTIL_EVIDENCE
revision_policy: APPEND_CAPTURE_NEVER_OVERWRITE
fetch_partition:
- trade_date
quality_checks:
- required_columns
- natural_key_duplicates
- provider_row_cap
- event_date_bounds
source_url: https://tushare.pro/document/2?doc_id=183
documentation_checked_on: '2026-10-01'
update_schedule: Trading days around 09:00
notes:
- Provider includes multiple asset types; future universe filtering must be explicit.
- Price limits are not evidence of executable orders.
- Schedule is documentation metadata, not a guaranteed availability timestamp; partitions
  and quality checks are proposed, not executed.
- Phase 1B explicitly requests optional pre_close, asset_type and exchange; asset
  scope must be observed, not inferred from suffix.
